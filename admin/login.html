<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin – NLP Group</title>
    <link rel="icon" type="image/x-icon" href="../favicon_io/favicon.ico">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div style="text-align:center;margin-bottom:1.75rem">
            <div style="font-size:1.6rem;font-weight:900;letter-spacing:-.03em;color:#1f2328;margin-bottom:.35rem">NLP <span style="color:#16a34a">GROUP</span></div>
            <p style="font-size:.85rem;color:#57606a">Đăng nhập vào trang quản trị</p>
        </div>

        <div id="adminAlert" class="alert"></div>

        <form onsubmit="doLogin(event)">
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user fa-fw" style="color:#16a34a;margin-right:.3rem"></i> Tên đăng nhập</label>
                <input id="loginUser" class="form-input" type="text" placeholder="admin" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-lock fa-fw" style="color:#16a34a;margin-right:.3rem"></i> Mật khẩu</label>
                <div style="position:relative">
                    <input id="loginPass" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:2.5rem">
                    <button type="button" onclick="togglePass()" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#57606a" id="togglePassBtn">
                        <i class="fa-solid fa-eye" id="passEye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.75rem;font-size:.95rem;margin-top:.5rem">
                <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
            </button>
        </form>

        <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #e5e7eb;font-size:.78rem;color:#57606a;text-align:center">
            <i class="fa-solid fa-circle-info" style="color:#16a34a;margin-right:.3rem"></i>
            Demo: <code style="background:#f3f4f6;padding:.1rem .4rem;border-radius:.3rem">admin</code> / <code style="background:#f3f4f6;padding:.1rem .4rem;border-radius:.3rem">nlpgroup2025</code>
        </div>

        <div style="margin-top:1rem;text-align:center">
            <a href="../index.html" style="font-size:.8rem;color:#57606a;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;hover:color:#16a34a">
                <i class="fa-solid fa-arrow-left fa-fw"></i> Về trang chủ
            </a>
        </div>
    </div>
</div>

<script>
    function togglePass() {
        const input = document.getElementById('loginPass');
        const eye   = document.getElementById('passEye');
        if (input.type === 'password') {
            input.type = 'text';
            eye.className = 'fa-solid fa-eye-slash';
        } else {
            input.type = 'password';
            eye.className = 'fa-solid fa-eye';
        }
    }

    function showAlert(msg, type='danger') {
        const el = document.getElementById('adminAlert');
        el.textContent = msg;
        el.className = `alert show alert-${type}`;
    }

    function doLogin(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        if (user === 'admin' && pass === 'nlpgroup2025') {
            sessionStorage.setItem('nlpgroup_admin_token', 'demo_' + Date.now());
            window.location.href = 'index.html';
        } else {
            showAlert('Sai tên đăng nhập hoặc mật khẩu. Vui lòng thử lại.');
        }
    }

    // If already logged in, redirect
    if (sessionStorage.getItem('nlpgroup_admin_token')) {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
